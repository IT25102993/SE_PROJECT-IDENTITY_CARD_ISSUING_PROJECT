<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="40" y1="40" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="60" y1="60" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Hexagon -->
  <rect width="240" height="240" rx="48" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Subtle Cyber Grid Lines -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="0" y1="40" x2="240" y2="40"/>
    <line x1="0" y1="80" x2="240" y2="80"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <line x1="0" y1="160" x2="240" y2="160"/>
    <line x1="0" y1="200" x2="240" y2="200"/>
  </g>

  <!-- Outer Security Shield -->
  <path d="M 120 32 C 160 32, 192 48, 192 84 C 192 144, 150 188, 120 208 C 90 188, 48 144, 48 84 C 48 48, 80 32, 120 32 Z" 
        fill="none" stroke="url(#accentGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Identity Card Geometry Inside Shield -->
  <rect x="70" y="78" width="100" height="66" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Smart Chip Icon -->
  <rect x="82" y="92" width="22" height="18" rx="3" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1"/>
  <line x1="93" y1="92" x2="93" y2="110" stroke="#78350f" stroke-width="0.8"/>
  <line x1="82" y1="101" x2="104" y2="101" stroke="#78350f" stroke-width="0.8"/>

  <!-- Biometric Verification Waves / Fingerprint Arcs -->
  <g stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 128 92 A 16 16 0 0 1 154 92"/>
    <path d="M 124 98 A 22 22 0 0 1 158 98"/>
    <path d="M 120 104 A 28 28 0 0 1 162 104"/>
    <path d="M 124 110 A 22 22 0 0 1 158 110"/>
  </g>

  <!-- Card Lines -->
  <rect x="82" y="122" width="46" height="4" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="82" y="130" width="30" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="152" cy="126" r="5" fill="#10b981"/>

  <!-- Verification Badge Checkmark at Bottom -->
  <g transform="translate(120, 168)">
    <circle cx="0" cy="0" r="16" fill="#10b981" stroke="#065f46" stroke-width="2" filter="url(#glow)"/>
    <path d="M -6 -1 L -2 4 L 7 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
