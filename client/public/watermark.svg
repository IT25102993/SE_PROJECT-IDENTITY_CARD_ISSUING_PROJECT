  <!-- National Lion Emblem Silhouette -->
  <path d="M 85 110 C 80 96, 85 82, 94 80 C 97 78, 98 81, 95 84 C 91 88, 89 100, 93 108 Z" fill="#f59e0b"/>
  <path d="M 88 108 C 86 100, 94 92, 104 92 C 112 92, 120 88, 122 80 C 126 80, 128 84, 124 90 C 126 92, 128 98, 124 102 C 120 106, 114 106, 110 108 C 108 112, 100 116, 92 115 Z" fill="#f59e0b"/>
