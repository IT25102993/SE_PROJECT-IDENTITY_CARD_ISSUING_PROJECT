  <circle cx="100" cy="100" r="75" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="50" stroke="#f59e0b" stroke-width="1"/>
  
  <!-- Security Guilloche Pattern Rays -->
  <g stroke="#3b82f6" stroke-width="0.8">
    <ellipse cx="100" cy="100" rx="85" ry="30" transform="rotate(0 100 100)"/>
    <ellipse cx="100" cy="100" rx="85" ry="30" transform="rotate(30 100 100)"/>
    <ellipse cx="100" cy="100" rx="85" ry="30" transform="rotate(60 100 100)"/>
    <ellipse cx="100" cy="100" rx="85" ry="30" transform="rotate(90 100 100)"/>
