<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Gov – Smart Identity Card Issuing System</title>
  <meta name="description" content="Nexus Gov – Modern Web-Based National Identity Card Issuing & Verification System for Sri Lanka." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Abhaya+Libre:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/index/logo.png" type="image/png">
  <style>
    /* Critical Inline Preloader Styles */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0a0d14;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      color: #f1f5f9;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .html-loader-card {
      position: relative;
      width: 90%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      background: rgba(18, 24, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45), 0 0 30px rgba(59, 130, 246, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
    }
    .html-loader-ambient {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(6, 182, 212, 0.1) 60%, transparent 80%);
      filter: blur(40px);
      pointer-events: none;
    }
    .html-loader-emblem {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .html-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #3b82f6;
      border-right-color: #06b6d4;
      animation: htmlSpin 2s linear infinite;
    }
    .html-ring-inner {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #10b981;
      border-left-color: #8b5cf6;
      animation: htmlSpinRev 1.5s linear infinite;
    }
    .html-icon-center {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #06b6d4;
    }
    .html-brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-top: 0.2rem;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .html-brand-sub {
      font-size: 0.82rem;
      color: #94a3b8;
    }
    .html-progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .html-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981);
      border-radius: 999px;
      animation: htmlProgress 1.2s ease-out forwards;
    }
    @keyframes htmlSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes htmlSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes htmlProgress { 0% { width: 5%; } 50% { width: 65%; } 100% { width: 100%; } }
  </style>
</head>

<body>
  <!-- Minimalistic HTML Preloader -->
  <div id="loader" role="status" aria-label="Loading Nexus Gov">
    <div class="html-loader-card">
      <div class="html-loader-ambient"></div>
      <div class="html-loader-emblem">
        <div class="html-ring-outer"></div>
        <div class="html-ring-inner"></div>
        <div class="html-icon-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <circle cx="9" cy="10" r="2"/>
            <line x1="15" y1="8" x2="17" y2="8"/>
            <line x1="15" y1="12" x2="17" y2="12"/>
            <line x1="7" y1="16" x2="17" y2="16"/>
          </svg>
        </div>
      </div>
      <div>
        <div style="font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; color: #06b6d4; text-transform: uppercase;">
          National Identity System
        </div>
        <div class="html-brand-title">NEXUS GOV</div>
        <div class="html-brand-sub">Loading Application Gateway...</div>
      </div>
      <div style="width: 100%;">
        <div class="html-progress-track">
          <div class="html-progress-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="sketch-bg"></canvas>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <script>
    // Smoothly remove preloader when React app loads
    window.hidePreloader = function() {
      const loader = document.getElementById('loader');
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 500);
      }
    };
    // Fallback timer
    setTimeout(window.hidePreloader, 2000);
  </script>
</body>

</html>
