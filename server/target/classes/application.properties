# NexusGov Identity Card System - Spring Boot Configuration
server.port=5000

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Default Database Settings (MySQL on localhost:3306)
app.datasource.mysql.url=jdbc:mysql://localhost:3306/identity_card_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
app.datasource.mysql.username=root
app.datasource.mysql.password=
app.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# Fallback H2 In-Memory Database Settings
app.datasource.h2.url=jdbc:h2:mem:identity_card_system;DB_CLOSE_DELAY=-1;MODE=MySQL
app.datasource.h2.username=sa
app.datasource.h2.password=
app.datasource.h2.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Gmail SMTP for OTP emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nexus.government.id.card@gmail.com
spring.mail.password=zsaejcdnypkrgszh
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT Authentication Secret
app.jwt.secret=nexusgov_identity_jwt_secret_key_2026_super_secure_hmac_sha_key!
app.jwt.expiration-days=7

# Active Environment
app.environment=development
